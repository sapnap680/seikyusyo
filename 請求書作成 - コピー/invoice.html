<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>請求書作成</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Segoe UI"', '"Hiragino Kaku Gothic ProN"', '"Noto Sans JP"', 'Meiryo', 'sans-serif'],
          },
          colors: {
            brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81',950:'#1e1b4b' },
            blue: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#6366f1',500:'#4f46e5',600:'#4338ca',700:'#3730a3',800:'#312e81',900:'#1e1b4b',950:'#131033' },
            cyan: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81',950:'#1e1b4b' },
            teal: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81',950:'#1e1b4b' },
          }
        }
      }
    };
  </script>
  <style>
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
    button, a { transition: all 0.2s ease; }
    button:active { transform: translateY(1px); }
    .line-unit,
    .line-qty,
    .line-amount {
      -moz-appearance: textfield;
      appearance: textfield;
      background-color: #f8fafc;
      cursor: default;
    }
    .line-unit::-webkit-outer-spin-button,
    .line-unit::-webkit-inner-spin-button,
    .line-qty::-webkit-outer-spin-button,
    .line-qty::-webkit-inner-spin-button,
    .line-amount::-webkit-outer-spin-button,
    .line-amount::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-slate-100 to-slate-200">
  <div class="bg-white/95 backdrop-blur-sm shadow-lg border-b-4 border-cyan-500">
    <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-cyan-600 bg-clip-text text-transparent">請求書作成</h1>
      <a href="./admin.html" class="px-6 py-2 bg-gradient-to-r from-blue-600 to-cyan-600 text-white rounded-xl font-bold hover:from-blue-700 hover:to-cyan-700 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">管理画面へ</a>
    </div>
  </div>

  <div class="max-w-5xl mx-auto px-6 py-6 pb-8 space-y-5">
    <div class="bg-white rounded-2xl shadow-xl p-8 animate-fade-up space-y-4">
      <h2 class="text-2xl font-bold text-gray-800 pb-3 border-b-2 border-cyan-500">請求書入力</h2>
      <div class="border border-emerald-200 border-l-4 border-l-emerald-500 rounded-xl p-4 bg-emerald-50/70">
        <h2 class="font-bold text-gray-800 mb-2">CSV一括作成</h2>
        <p class="text-sm text-gray-700 mb-3">
          CSVからまとめて請求書を作成できます（依頼部署は全件「財務」、締め日は空で保存）。
        </p>
        <div class="flex flex-wrap gap-3 items-center">
          <input id="csvFileInput" type="file" accept=".csv,text/csv" class="text-sm">
          <button id="csvImportUniversityBtn" type="button" class="px-4 py-2 rounded-lg bg-emerald-600 text-white font-bold hover:bg-emerald-700">大学・連盟用CSVを取り込む</button>
          <button id="csvImportCorporateBtn" type="button" class="px-4 py-2 rounded-lg bg-indigo-600 text-white font-bold hover:bg-indigo-700">企業用CSVを取り込む</button>
        </div>
      </div>

      <form id="invoiceForm" class="space-y-5">
        <section class="rounded-xl border border-gray-200 p-5 space-y-4">
          <h3 class="font-bold text-gray-800 pb-2 border-b border-gray-200">基本情報</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">請求書番号</label>
              <input id="invoiceNo" type="text" required placeholder="自動入力後に手動で変更可能" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">発行日</label>
              <input id="issueDate" type="date" required class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
            </div>
            <div id="closingDateWrap">
              <label class="block text-sm font-bold text-gray-700 mb-1">締め日</label>
              <input id="closingDate" type="date" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">振込期限</label>
              <input id="dueDate" type="date" required class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
            </div>
            <div id="federationContactWrap">
              <label class="block text-sm font-bold text-gray-700 mb-1">担当者（当連盟理事）</label>
              <input id="clientContact" type="text" placeholder="例: 榎田" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
            </div>
          </div>
        </section>

        <section class="rounded-xl border border-gray-200 p-5 space-y-4">
          <h3 class="font-bold text-gray-800 pb-2 border-b border-gray-200">請求先情報</h3>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">宛先種別（PDFの敬称）</label>
            <select id="recipientKind" class="w-full md:w-72 border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
              <option value="company" selected>企業・会社（手動フォーマット / 貴社）</option>
              <option value="school">大学・連盟（明細フォーマット / 貴学）</option>
            </select>
            <p id="recipientKindHint" class="text-xs text-gray-500 mt-1"></p>
          </div>
          <div id="companyRecipientFields" class="space-y-4">
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">相手先会社名</label>
              <input id="clientName" type="text" required class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">相手先 郵便番号</label>
                <input id="clientZip" type="text" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">相手先 住所</label>
                <input id="clientAddress" type="text" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
              </div>
            </div>
          </div>
          <div id="schoolRecipientFields" class="hidden space-y-4">
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">宛名</label>
              <input id="schoolClientName" type="text" placeholder="例: 北翔大学女子バスケットボール部" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
            </div>
          </div>
        </section>

        <section class="rounded-xl border border-gray-200 p-5 space-y-4">
          <h3 class="font-bold text-gray-800 pb-2 border-b border-gray-200">明細・金額</h3>
          <div id="companyDetailFields" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">科目名（任意入力）</label>
                <input id="subjectName" type="text" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">備考</label>
                <input id="description" type="text" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">区分（任意入力）</label>
                <input id="category" type="text" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">依頼部署（任意入力）</label>
                <input id="requestDepartment" type="text" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
              </div>
            </div>
          </div>

          <div id="schoolDetailFields" class="hidden space-y-3">
            <div class="overflow-x-auto">
              <table class="w-full border-collapse text-sm">
                <thead>
                  <tr class="bg-cyan-50">
                    <th class="border border-gray-300 px-2 py-2 text-left">内容</th>
                    <th class="border border-gray-300 px-2 py-2 text-center w-28">単価</th>
                    <th class="border border-gray-300 px-2 py-2 text-center w-20">数</th>
                    <th class="border border-gray-300 px-2 py-2 text-center w-28">金額</th>
                  </tr>
                </thead>
                <tbody id="lineItemsBody">
                  <tr class="line-item-row" data-index="1">
                    <td class="border border-gray-300 p-1"><input type="text" class="line-content w-full border rounded px-2 py-1.5" placeholder="内容1"></td>
                    <td class="border border-gray-300 p-1"><input type="text" inputmode="numeric" class="line-unit w-full border rounded px-2 py-1.5 text-center" placeholder=""></td>
                    <td class="border border-gray-300 p-1"><input type="text" inputmode="numeric" class="line-qty w-full border rounded px-2 py-1.5 text-center" placeholder=""></td>
                    <td class="border border-gray-300 p-1"><input type="text" readonly tabindex="-1" class="line-amount w-full border rounded px-2 py-1.5 text-center" placeholder=""></td>
                  </tr>
                  <tr class="line-item-row" data-index="2">
                    <td class="border border-gray-300 p-1"><input type="text" class="line-content w-full border rounded px-2 py-1.5" placeholder="内容2"></td>
                    <td class="border border-gray-300 p-1"><input type="text" inputmode="numeric" class="line-unit w-full border rounded px-2 py-1.5 text-center" placeholder=""></td>
                    <td class="border border-gray-300 p-1"><input type="text" inputmode="numeric" class="line-qty w-full border rounded px-2 py-1.5 text-center" placeholder=""></td>
                    <td class="border border-gray-300 p-1"><input type="text" readonly tabindex="-1" class="line-amount w-full border rounded px-2 py-1.5 text-center" placeholder=""></td>
                  </tr>
                  <tr class="line-item-row" data-index="3">
                    <td class="border border-gray-300 p-1"><input type="text" class="line-content w-full border rounded px-2 py-1.5" placeholder="内容3"></td>
                    <td class="border border-gray-300 p-1"><input type="text" inputmode="numeric" class="line-unit w-full border rounded px-2 py-1.5 text-center" placeholder=""></td>
                    <td class="border border-gray-300 p-1"><input type="text" inputmode="numeric" class="line-qty w-full border rounded px-2 py-1.5 text-center" placeholder=""></td>
                    <td class="border border-gray-300 p-1"><input type="text" readonly tabindex="-1" class="line-amount w-full border rounded px-2 py-1.5 text-center" placeholder=""></td>
                  </tr>
                  <tr class="line-item-row" data-index="4">
                    <td class="border border-gray-300 p-1"><input type="text" class="line-content w-full border rounded px-2 py-1.5" placeholder="内容4"></td>
                    <td class="border border-gray-300 p-1"><input type="text" inputmode="numeric" class="line-unit w-full border rounded px-2 py-1.5 text-center" placeholder=""></td>
                    <td class="border border-gray-300 p-1"><input type="text" inputmode="numeric" class="line-qty w-full border rounded px-2 py-1.5 text-center" placeholder=""></td>
                    <td class="border border-gray-300 p-1"><input type="text" readonly tabindex="-1" class="line-amount w-full border rounded px-2 py-1.5 text-center" placeholder=""></td>
                  </tr>
                  <tr class="line-item-row" data-index="5">
                    <td class="border border-gray-300 p-1"><input type="text" class="line-content w-full border rounded px-2 py-1.5" placeholder="内容5"></td>
                    <td class="border border-gray-300 p-1"><input type="text" inputmode="numeric" class="line-unit w-full border rounded px-2 py-1.5 text-center" placeholder=""></td>
                    <td class="border border-gray-300 p-1"><input type="text" inputmode="numeric" class="line-qty w-full border rounded px-2 py-1.5 text-center" placeholder=""></td>
                    <td class="border border-gray-300 p-1"><input type="text" readonly tabindex="-1" class="line-amount w-full border rounded px-2 py-1.5 text-center" placeholder=""></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <p id="schoolLineTotalHint" class="text-sm text-gray-600 font-bold">明細合計: ¥0</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-cyan-50 p-4 rounded-xl border border-cyan-200">
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">消費税率</label>
              <select id="taxRate" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
                <option value="10">10%</option>
                <option value="8">8%</option>
                <option value="0">0%</option>
                <option value="other">その他（発生額/消費税額を入力）</option>
              </select>
            </div>
            <div id="normalTaxBaseCol">
              <label class="block text-sm font-bold text-gray-700 mb-1">税抜金額</label>
              <input id="baseAmountInput" type="number" min="0" value="0" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
            </div>
            <div id="normalTaxTotalCol">
              <label class="block text-sm font-bold text-gray-700 mb-1">税込金額</label>
              <input id="totalAmountInput" type="number" min="0" value="0" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
            </div>
            <div id="directTaxInputCols" class="hidden md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">発生額（直接入力）</label>
                <input id="occurrenceAmountInput" type="number" min="0" value="0" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">消費税額（直接入力）</label>
                <input id="taxAmountDirectInput" type="number" min="0" value="0" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none">
              </div>
            </div>
          </div>

          <p id="taxHint" class="text-sm text-gray-600 font-bold">消費税: ¥0</p>
        </section>

        <div class="flex gap-3">
          <button type="submit" id="saveBtn" class="px-6 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-bold hover:from-blue-700 hover:to-cyan-700 shadow-md">保存</button>
          <button type="button" id="previewBtn" class="px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold hover:from-cyan-700 hover:to-blue-700 shadow-md">保存して印刷確認</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./js/firebase.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/date-utils.js"></script>
  <script>
    const form = document.getElementById("invoiceForm");
    const taxRate = document.getElementById("taxRate");
    const baseAmountInput = document.getElementById("baseAmountInput");
    const totalAmountInput = document.getElementById("totalAmountInput");
    const occurrenceAmountInput = document.getElementById("occurrenceAmountInput");
    const taxAmountDirectInput = document.getElementById("taxAmountDirectInput");
    const normalTaxBaseCol = document.getElementById("normalTaxBaseCol");
    const normalTaxTotalCol = document.getElementById("normalTaxTotalCol");
    const directTaxInputCols = document.getElementById("directTaxInputCols");
    const issueDate = document.getElementById("issueDate");
    const closingDate = document.getElementById("closingDate");
    const dueDate = document.getElementById("dueDate");
    const invoiceNo = document.getElementById("invoiceNo");
    const taxHint = document.getElementById("taxHint");
    const csvFileInput = document.getElementById("csvFileInput");
    const recipientKind = document.getElementById("recipientKind");
    const schoolLineTotalHint = document.getElementById("schoolLineTotalHint");
    let syncing = false;
    let lastEdited = "base";

    function isSchoolRecipient() {
      return recipientKind.value === "school";
    }

    function updateRecipientKindUi() {
      const school = isSchoolRecipient();
      document.getElementById("closingDateWrap").classList.toggle("hidden", school);
      document.getElementById("federationContactWrap").classList.toggle("hidden", school);
      document.getElementById("companyRecipientFields").classList.toggle("hidden", school);
      document.getElementById("schoolRecipientFields").classList.toggle("hidden", !school);
      document.getElementById("companyDetailFields").classList.toggle("hidden", school);
      document.getElementById("schoolDetailFields").classList.toggle("hidden", !school);
      normalTaxBaseCol.classList.toggle("hidden", school || isDirectTaxMode());
      normalTaxTotalCol.classList.toggle("hidden", school || isDirectTaxMode());

      document.getElementById("clientName").required = !school;
      document.getElementById("schoolClientName").required = school;
      closingDate.required = !school;

      const hint = document.getElementById("recipientKindHint");
      if (hint) {
        hint.textContent = school
          ? "大学・連盟向けPDF（明細表・貴学）。締め日と当連盟理事名はPDFに出ません。依頼部署は「財務」で保存されます。"
          : "企業向けPDF（3行サマリー表・貴社）。締め日と当連盟理事名がPDFに表示されます。";
      }

      if (school) {
        syncAllLineItemAmounts();
      } else {
        recalculateByLastEdited();
      }
    }

    function parseInputNumber(value) {
      const n = Number(String(value ?? "").replace(/,/g, "").trim());
      return Number.isFinite(n) ? n : Number.NaN;
    }

    function syncLineItemAmount(row) {
      const unit = parseInputNumber(row.querySelector(".line-unit")?.value);
      const qty = parseInputNumber(row.querySelector(".line-qty")?.value);
      const amountEl = row.querySelector(".line-amount");
      if (!amountEl) return;
      if (Number.isFinite(unit) && Number.isFinite(qty)) {
        amountEl.value = String(unit * qty);
      } else {
        amountEl.value = "";
      }
    }

    function syncAllLineItemAmounts() {
      document.querySelectorAll(".line-item-row").forEach(syncLineItemAmount);
      syncSchoolLineTotalHint();
    }

    function collectLineItems() {
      const items = [];
      document.querySelectorAll(".line-item-row").forEach((row) => {
        const content = row.querySelector(".line-content")?.value.trim() || "";
        const unit = parseInputNumber(row.querySelector(".line-unit")?.value);
        const qty = parseInputNumber(row.querySelector(".line-qty")?.value);
        const amount = Number.isFinite(unit) && Number.isFinite(qty) ? unit * qty : 0;
        items.push({
          content,
          unitPrice: Number.isFinite(unit) ? unit : 0,
          quantity: Number.isFinite(qty) ? qty : 0,
          amount,
        });
      });
      return items;
    }

    function getSchoolLineTotal() {
      return collectLineItems().reduce((sum, item) => sum + Number(item.amount || 0), 0);
    }

    function syncSchoolLineTotalHint() {
      if (!schoolLineTotalHint) return;
      schoolLineTotalHint.textContent = `明細合計: ${yen(getSchoolLineTotal())}`;
    }

    function yen(value) {
      return "¥" + Number(value || 0).toLocaleString("ja-JP");
    }

    function isDirectTaxMode() {
      return taxRate.value === "other";
    }

    function syncDirectTaxHint() {
      const occurrence = Number(occurrenceAmountInput.value || 0);
      const tax = Number(taxAmountDirectInput.value || 0);
      const billed = Math.max(0, occurrence + tax);
      taxHint.textContent = `消費税: ${yen(tax)} / ご請求金額: ${yen(billed)}`;
    }

    function updateTaxInputModeUi() {
      const direct = isDirectTaxMode();
      const school = isSchoolRecipient();
      normalTaxBaseCol.classList.toggle("hidden", direct || school);
      normalTaxTotalCol.classList.toggle("hidden", direct || school);
      directTaxInputCols.classList.toggle("hidden", !direct);
      if (direct) {
        syncDirectTaxHint();
      } else if (school) {
        syncSchoolLineTotalHint();
      } else {
        recalculateByLastEdited();
      }
    }

    function setDefaultDates() {
      const today = new Date();
      const iso = today.toISOString().slice(0, 10);
      issueDate.value = iso;
      closingDate.value = iso;

      const due = new Date(today);
      due.setDate(due.getDate() + 30);
      dueDate.value = due.toISOString().slice(0, 10);
    }

    async function loadNextInvoiceNo(forceSet) {
      try {
        const nextNo = await getNextInvoiceNumberFromInvoices();
        if (forceSet || !invoiceNo.value.trim()) {
          invoiceNo.value = nextNo;
        }
      } catch (error) {
        console.error("次番号取得失敗:", error);
        if (forceSet || !invoiceNo.value.trim()) {
          invoiceNo.value = "1";
        }
      }
    }

    async function ensureInvoiceNo() {
      if (invoiceNo.value.trim()) return;
      await loadNextInvoiceNo(true);
    }

    function syncFromBase() {
      if (isDirectTaxMode()) return;
      if (syncing) return;
      syncing = true;
      lastEdited = "base";
      const calc = calculateTaxBreakdown("tax_excluded", Number(taxRate.value), Number(baseAmountInput.value));
      totalAmountInput.value = calc.occurrenceAmount;
      taxHint.textContent = `消費税: ${yen(calc.taxAmount)}`;
      syncing = false;
    }

    function syncFromTotal() {
      if (isDirectTaxMode()) return;
      if (syncing) return;
      syncing = true;
      lastEdited = "total";
      const calc = calculateTaxBreakdown("tax_included", Number(taxRate.value), Number(totalAmountInput.value));
      baseAmountInput.value = calc.baseAmount;
      taxHint.textContent = `消費税: ${yen(calc.taxAmount)}`;
      syncing = false;
    }

    function recalculateByLastEdited() {
      if (isDirectTaxMode()) {
        syncDirectTaxHint();
        return;
      }
      if (lastEdited === "total") {
        syncFromTotal();
      } else {
        syncFromBase();
      }
    }

    async function submitInvoice(withPrint) {
      const school = isSchoolRecipient();
      if (school) {

          alert("宛名を入力してください");

            baseAmount: occurrenceDirect,
            taxAmount: taxDirect,
            occurrenceAmount: occurrenceDirect,
            billedAmount: occurrenceDirect + taxDirect,
          };
        } else {
          calc = calculateTaxBreakdown("tax_included", Number(taxRate.value), lineTotal);
        }
      } else if (isDirectTaxMode()) {
        const occurrenceDirect = Number(occurrenceAmountInput.value);
        const taxDirect = Number(taxAmountDirectInput.value);
        if (!Number.isFinite(occurrenceDirect) || occurrenceDirect < 0) {
          alert("発生額は0以上の数値で入力してください");
          return;
        }
        if (!Number.isFinite(taxDirect) || taxDirect < 0) {
          alert("消費税額は0以上の数値で入力してください");
          return;
        }
        calc = {
          taxRate: "other",
          baseAmount: occurrenceDirect,
          taxAmount: taxDirect,
          occurrenceAmount: occurrenceDirect,
          billedAmount: occurrenceDirect + taxDirect,
        };
      } else {
        calc = calculateTaxBreakdown("tax_excluded", Number(taxRate.value), Number(baseAmountInput.value));
      }
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "保存中...";

      const lineItems = school
        ? collectLineItems()
        : [{
            content: document.getElementById("description").value.trim() || "",
            unitPrice: calc.baseAmount,
            amount: calc.baseAmount,
          }];
      const primaryDescription = school
        ? (lineItems.find((item) => item.content)?.content || "")
        : document.getElementById("description").value.trim();

      try {

          invoiceNo: document.getElementById("invoiceNo").value.trim(),
          issueDate: issueDate.value,
          closingDate: school ? "" : closingDate.value,
          dueDate: dueDate.value,
          clientName: school
            ? document.getElementById("schoolClientName").value.trim()
            : document.getElementById("clientName").value.trim(),
          clientContact: school ? "" : document.getElementById("clientContact").value.trim(),
          clientZip: school ? "" : document.getElementById("clientZip").value.trim(),
          clientAddress: school ? "" : document.getElementById("clientAddress").value.trim(),
          subjectName: school ? "" : document.getElementById("subjectName").value.trim(),
          category: school ? "" : document.getElementById("category").value.trim(),
          requestDepartment: school ? "財務" : document.getElementById("requestDepartment").value.trim(),
          description: primaryDescription,
          taxRate: calc.taxRate,
          baseInput: isDirectTaxMode() ? calc.baseAmount : Number(baseAmountInput.value),
          totalInput: isDirectTaxMode() ? calc.billedAmount : Number(totalAmountInput.value),
          baseAmount: calc.baseAmount,
          taxAmount: calc.taxAmount,
          occurrenceAmount: school ? calc.occurrenceAmount : calc.baseAmount,

    function parseCsvRow(line) {
      const values = [];
      let cur = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i += 1) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }
        if (ch === "," && !inQuotes) {
          values.push(cur);
          cur = "";
          continue;
        }
        cur += ch;
      }
      values.push(cur);
      return values.map((v) => v.trim());
    }

    function normalizeHeaderName(name) {
      return String(name || "")
        .replace(/\uFEFF/g, "")
        .trim()
        .toLowerCase()
        .replace(/[ 　\t\r\n]/g, "")
        .replace(/[()（）]/g, "");
    }

    function buildHeaderResolver(header) {
      const normalized = header.map((h) => normalizeHeaderName(h));
      return (aliases) => {
        for (const alias of aliases) {
          const key = normalizeHeaderName(alias);
          const idx = normalized.findIndex((h) => h === key);
          if (idx >= 0) return idx;
        }
        return -1;
      };
    }

    function getCell(row, index) {
      if (index < 0) return "";
      return (row[index] || "").trim();
    }

    function toNumberOrNaN(value) {
      const s = String(value ?? "").replace(/,/g, "").trim();
      if (!s) return Number.NaN;
      return Number(s);
    }

    function parseTaxRateInput(value, fallback = 10) {
      const raw = String(value ?? "").trim();
      if (!raw) return fallback;
      const normalized = raw
        .replace(/[％%]/g, "")
        .replace(/消費税/g, "")
        .trim();
      const n = Number(normalized);
      return Number.isFinite(n) ? n : fallback;
    }

    async function importCsvInvoices(importType) {
      const file = csvFileInput.files && csvFileInput.files[0];
      if (!file) {
        alert("CSVファイルを選択してください");
        return;
      }
      const isCorporate = importType === "corporate";
      const isUniversity = importType === "university";

      const text = await file.text();
      const rawLines = text.split(/\r?\n/).filter((line) => line.trim() !== "");
      if (rawLines.length < 2) {
        alert("CSVデータが不足しています（ヘッダー+1行以上必要）");
        return;
      }

      const header = parseCsvRow(rawLines[0]);
      const resolveIdx = buildHeaderResolver(header);
      const normalizedHeader = header.map((h) => normalizeHeaderName(h));
      const indexSet = (aliases) => new Set(aliases.map((a) => normalizeHeaderName(a)));
      function findNextIndex(aliases, afterIdx) {
        const aliasSet = indexSet(aliases);
        for (let i = Math.max(afterIdx + 1, 0); i < normalizedHeader.length; i += 1) {
          if (aliasSet.has(normalizedHeader[i])) return i;
        }
        return -1;
      }

      const issueDateIdx = resolveIdx(["issueDate", "請求日"]);
      const closingDateIdx = resolveIdx(["closingDate", "締め日", "締切日", "締切"]);
      const dueDateIdx = resolveIdx(["dueDate", "お支払期限", "お支払い期限", "支払期限", "振込期限"]);
      const clientNameIdx = resolveIdx(["clientName", "相手先会社名", "相手先", "御中", "請求先", "会社名", "宛名"]);
      const invoiceNoIdx = resolveIdx(["invoiceNo", "No.", "No", "番号"]);
      const rateIdx = resolveIdx(["taxRate", "税率"]);
      const baseIdx = resolveIdx(["baseAmount", "10%対象", "税抜金額", "対象金額"]);
      const totalIdx = resolveIdx(["totalAmount", "ご請求金額", "請求金額", "税込金額"]);
      const taxAmountIdx = resolveIdx(["消費税", "taxAmount"]);
      const subjectIdx = resolveIdx(["subjectName", "科目名"]);
      const categoryIdx = resolveIdx(["category", "区分"]);
      const descriptionIdx = resolveIdx(["description", "内容", "摘要", "備考"]);
      const requestDeptIdx = resolveIdx(["requestDepartment", "依頼部署"]);
      const contactIdx = resolveIdx(["clientContact", "担当者名", "相手先担当者名", "当連盟担当者名", "当連盟担当者名理事名", "担当者"]);
      const zipIdx = resolveIdx(["clientZip", "相手先郵便番号", "郵便番号"]);
      const addressIdx = resolveIdx(["clientAddress", "相手先住所", "住所"]);
      const issuedFlagIdx = resolveIdx(["発行", "発行済", "ok"]);
      const content1Idx = resolveIdx(["内容1", "内容_1", "内容①", "内容"]);
      const content2Resolved = resolveIdx(["内容2", "内容_2", "内容②"]);
      const content2Idx = content2Resolved >= 0 ? content2Resolved : findNextIndex(["内容"], content1Idx);
      const content3Resolved = resolveIdx(["内容3", "内容_3", "内容③"]);
      const content3Idx = content3Resolved >= 0 ? content3Resolved : findNextIndex(["内容"], content2Idx >= 0 ? content2Idx : content1Idx);
      const content4Resolved = resolveIdx(["内容4", "内容_4", "内容④"]);
      const content4Idx = content4Resolved >= 0 ? content4Resolved : findNextIndex(["内容"], content3Idx >= 0 ? content3Idx : content2Idx);
      const content5Resolved = resolveIdx(["内容5", "内容_5", "内容⑤"]);
      const content5Idx = content5Resolved >= 0 ? content5Resolved : findNextIndex(["内容"], content4Idx >= 0 ? content4Idx : content3Idx);
      const unit1Idx = resolveIdx(["単価1", "単価_1", "単価①", "単価"]);
      const unit2Resolved = resolveIdx(["単価2", "単価_2", "単価②"]);
      const unit2Idx = unit2Resolved >= 0 ? unit2Resolved : findNextIndex(["単価"], unit1Idx);
      const unit3Resolved = resolveIdx(["単価3", "単価_3", "単価③"]);
      const unit3Idx = unit3Resolved >= 0 ? unit3Resolved : findNextIndex(["単価"], unit2Idx >= 0 ? unit2Idx : unit1Idx);
      const unit4Resolved = resolveIdx(["単価4", "単価_4", "単価④"]);
      const unit4Idx = unit4Resolved >= 0 ? unit4Resolved : findNextIndex(["単価"], unit3Idx >= 0 ? unit3Idx : unit2Idx);
      const unit5Resolved = resolveIdx(["単価5", "単価_5", "単価⑤"]);
      const unit5Idx = unit5Resolved >= 0 ? unit5Resolved : findNextIndex(["単価"], unit4Idx >= 0 ? unit4Idx : unit3Idx);
      const qty1Idx = resolveIdx(["数1", "数_1", "数①", "数", "数量1", "数量"]);
      const qty2Resolved = resolveIdx(["数2", "数_2", "数②", "数量2"]);
      const qty2Idx = qty2Resolved >= 0 ? qty2Resolved : findNextIndex(["数", "数量"], qty1Idx);
      const qty3Resolved = resolveIdx(["数3", "数_3", "数③", "数量3"]);
      const qty3Idx = qty3Resolved >= 0 ? qty3Resolved : findNextIndex(["数", "数量"], qty2Idx >= 0 ? qty2Idx : qty1Idx);
      const qty4Resolved = resolveIdx(["数4", "数_4", "数④", "数量4"]);
      const qty4Idx = qty4Resolved >= 0 ? qty4Resolved : findNextIndex(["数", "数量"], qty3Idx >= 0 ? qty3Idx : qty2Idx);
      const qty5Resolved = resolveIdx(["数5", "数_5", "数⑤", "数量5"]);
      const qty5Idx = qty5Resolved >= 0 ? qty5Resolved : findNextIndex(["数", "数量"], qty4Idx >= 0 ? qty4Idx : qty3Idx);
      const amount1Idx = resolveIdx(["金額1", "金額_1", "金額①", "金額"]);
      const amount2Resolved = resolveIdx(["金額2", "金額_2", "金額②"]);
      const amount2Idx = amount2Resolved >= 0 ? amount2Resolved : findNextIndex(["金額"], amount1Idx);
      const amount3Resolved = resolveIdx(["金額3", "金額_3", "金額③"]);
      const amount3Idx = amount3Resolved >= 0 ? amount3Resolved : findNextIndex(["金額"], amount2Idx >= 0 ? amount2Idx : amount1Idx);
      const amount4Resolved = resolveIdx(["金額4", "金額_4", "金額④"]);
      const amount4Idx = amount4Resolved >= 0 ? amount4Resolved : findNextIndex(["金額"], amount3Idx >= 0 ? amount3Idx : amount2Idx);
      const amount5Resolved = resolveIdx(["金額5", "金額_5", "金額⑤"]);
      const amount5Idx = amount5Resolved >= 0 ? amount5Resolved : findNextIndex(["金額"], amount4Idx >= 0 ? amount4Idx : amount3Idx);

      const missing = [];
      if (isCorporate && closingDateIdx < 0) missing.push("締め日(closingDate)");
      if (dueDateIdx < 0) missing.push("お支払期限(dueDate)");
      if (clientNameIdx < 0) missing.push("相手先会社名(clientName)");
      if (isCorporate && zipIdx < 0) missing.push("相手先郵便番号(clientZip)");
      if (isCorporate && addressIdx < 0) missing.push("相手先住所(clientAddress)");
      if (missing.length > 0) {
        alert("必須ヘッダーが不足しています: " + missing.join(", "));
        return;
      }

      let nextNo = Number(await getNextInvoiceNumberFromInvoices());
      if (!Number.isFinite(nextNo) || nextNo <= 0) nextNo = 1;

      let created = 0;
      const errors = [];

      for (let lineNo = 1; lineNo < rawLines.length; lineNo += 1) {
        const row = parseCsvRow(rawLines[lineNo]);
        try {
          const issuedFlag = issuedFlagIdx >= 0 ? getCell(row, issuedFlagIdx).toLowerCase() : "";
          if (isCorporate && issuedFlag === "ok") {
            continue;
          }
          const todayIso = new Date().toISOString().slice(0, 10);
          const issueDateVal = issueDateIdx >= 0
            ? (normalizeDateInput(getCell(row, issueDateIdx)) || todayIso)
            : todayIso;
          const closingDateVal = closingDateIdx >= 0 ? normalizeDateInput(getCell(row, closingDateIdx)) : "";
          const dueDateVal = normalizeDateInput(getCell(row, dueDateIdx));
          const clientNameVal = getCell(row, clientNameIdx);
          if (!dueDateVal || !clientNameVal) {
            throw new Error("お支払期限・相手先会社名は必須です");
          }
          if (isCorporate && !closingDateVal) {
            throw new Error("企業用CSVでは締め日が必須です");
          }
          const zipVal = getCell(row, zipIdx);
          const addressVal = getCell(row, addressIdx);
          if (isCorporate && (!zipVal || !addressVal)) {
            throw new Error("企業用CSVでは相手先郵便番号・相手先住所が必須です");
          }

          const csvNo = getCell(row, invoiceNoIdx);
          const invoiceNoVal = csvNo || String(nextNo++);

          const taxRateVal = rateIdx >= 0 ? parseTaxRateInput(getCell(row, rateIdx), 10) : 10;
          const safeRate = [0, 8, 10].includes(taxRateVal) ? taxRateVal : 10;

          const unit1 = toNumberOrNaN(getCell(row, unit1Idx));
          const qty1 = toNumberOrNaN(getCell(row, qty1Idx));
          const amount1 = toNumberOrNaN(getCell(row, amount1Idx));
          const unit2 = toNumberOrNaN(getCell(row, unit2Idx));
          const qty2 = toNumberOrNaN(getCell(row, qty2Idx));
          const amount2 = toNumberOrNaN(getCell(row, amount2Idx));
          const unit3 = toNumberOrNaN(getCell(row, unit3Idx));
          const qty3 = toNumberOrNaN(getCell(row, qty3Idx));
          const amount3 = toNumberOrNaN(getCell(row, amount3Idx));
          const unit4 = toNumberOrNaN(getCell(row, unit4Idx));
          const qty4 = toNumberOrNaN(getCell(row, qty4Idx));
          const amount4 = toNumberOrNaN(getCell(row, amount4Idx));
          const unit5 = toNumberOrNaN(getCell(row, unit5Idx));
          const qty5 = toNumberOrNaN(getCell(row, qty5Idx));
          const amount5 = toNumberOrNaN(getCell(row, amount5Idx));

          const computedAmount1 = Number.isFinite(amount1) ? amount1 : (Number.isFinite(unit1) && Number.isFinite(qty1) ? unit1 * qty1 : 0);
          const computedAmount2 = Number.isFinite(amount2) ? amount2 : (Number.isFinite(unit2) && Number.isFinite(qty2) ? unit2 * qty2 : 0);
          const computedAmount3 = Number.isFinite(amount3) ? amount3 : (Number.isFinite(unit3) && Number.isFinite(qty3) ? unit3 * qty3 : 0);
          const computedAmount4 = Number.isFinite(amount4) ? amount4 : (Number.isFinite(unit4) && Number.isFinite(qty4) ? unit4 * qty4 : 0);
          const computedAmount5 = Number.isFinite(amount5) ? amount5 : (Number.isFinite(unit5) && Number.isFinite(qty5) ? unit5 * qty5 : 0);
          const lineTotal = computedAmount1 + computedAmount2 + computedAmount3 + computedAmount4 + computedAmount5;

          const baseRaw = baseIdx >= 0 ? toNumberOrNaN(getCell(row, baseIdx)) : Number.NaN;
          const totalRaw = totalIdx >= 0 ? toNumberOrNaN(getCell(row, totalIdx)) : Number.NaN;
          const taxRaw = taxAmountIdx >= 0 ? toNumberOrNaN(getCell(row, taxAmountIdx)) : Number.NaN;

          let calc;
          if (Number.isFinite(baseRaw) && baseRaw > 0) {
            calc = calculateTaxBreakdown("tax_excluded", safeRate, baseRaw);
            if (Number.isFinite(taxRaw) && taxRaw >= 0 && !Number.isFinite(totalRaw)) {
              calc.taxAmount = taxRaw;
              calc.occurrenceAmount = calc.baseAmount + taxRaw;
              calc.billedAmount = calc.occurrenceAmount;
            }
          } else if (Number.isFinite(totalRaw) && totalRaw > 0) {
            calc = calculateTaxBreakdown("tax_included", safeRate, totalRaw);
          } else if (lineTotal > 0) {
            calc = calculateTaxBreakdown("tax_included", safeRate, lineTotal);
          } else {
            throw new Error("ご請求金額(totalAmount) または 明細(金額/単価×数) を入力してください");
          }

          const occurrenceForSave = isCorporate ? calc.baseAmount : calc.occurrenceAmount;
          const billedForSave = isCorporate ? (calc.baseAmount + calc.taxAmount) : calc.billedAmount;
          const totalInputForSave = isCorporate ? billedForSave : calc.occurrenceAmount;

          const invoice = {
            invoiceNo: invoiceNoVal,
            issueDate: issueDateVal,
            closingDate: isUniversity ? "" : closingDateVal,
            dueDate: dueDateVal,
            clientName: clientNameVal,
            clientContact: getCell(row, contactIdx),
            clientZip: zipVal,
            clientAddress: addressVal,
            subjectName: getCell(row, subjectIdx),
            category: getCell(row, categoryIdx),
            requestDepartment: isUniversity ? "財務" : (getCell(row, requestDeptIdx) || ""),
            description: getCell(row, descriptionIdx) || getCell(row, content1Idx),
            taxRate: calc.taxRate,
            baseInput: calc.baseAmount,
            totalInput: totalInputForSave,
            baseAmount: calc.baseAmount,
            taxAmount: calc.taxAmount,
            occurrenceAmount: occurrenceForSave,
            billedAmount: billedForSave,
            sourceType: isUniversity ? "csv" : "manual",
            recipientKind: isUniversity ? "school" : "company",
            lineItems: [
              {
                content: getCell(row, content1Idx),
                unitPrice: Number.isFinite(unit1) ? unit1 : 0,
                quantity: Number.isFinite(qty1) ? qty1 : 0,
                amount: computedAmount1,
              },
              {
                content: getCell(row, content2Idx),
                unitPrice: Number.isFinite(unit2) ? unit2 : 0,
                quantity: Number.isFinite(qty2) ? qty2 : 0,
                amount: computedAmount2,
              },
              {
                content: getCell(row, content3Idx),
                unitPrice: Number.isFinite(unit3) ? unit3 : 0,
                quantity: Number.isFinite(qty3) ? qty3 : 0,
                amount: computedAmount3,
              },
              {
                content: getCell(row, content4Idx),
                unitPrice: Number.isFinite(unit4) ? unit4 : 0,
                quantity: Number.isFinite(qty4) ? qty4 : 0,
                amount: computedAmount4,
              },
              {
                content: getCell(row, content5Idx),
                unitPrice: Number.isFinite(unit5) ? unit5 : 0,
                quantity: Number.isFinite(qty5) ? qty5 : 0,
                amount: computedAmount5,
              },
            ],
            totalPaid: 0,
            status: "unpaid",
          };

          await saveInvoice(invoice);
          created += 1;
        } catch (error) {
          errors.push(`行${lineNo + 1}: ${error.message}`);
        }
      }

      await loadNextInvoiceNo(true);
      if (errors.length === 0) {
        alert(`${isCorporate ? "企業用" : "大学・連盟用"}CSV取込完了: ${created}件作成しました`);
      } else {
        alert(`${isCorporate ? "企業用" : "大学・連盟用"}CSV取込完了: ${created}件作成 / エラー${errors.length}件\n` + errors.slice(0, 5).join("\n"));
      }
    }

    baseAmountInput.addEventListener("input", syncFromBase);
    totalAmountInput.addEventListener("input", syncFromTotal);
    occurrenceAmountInput.addEventListener("input", syncDirectTaxHint);
    taxAmountDirectInput.addEventListener("input", syncDirectTaxHint);
    taxRate.addEventListener("change", () => {
      updateTaxInputModeUi();
      if (isSchoolRecipient()) syncSchoolLineTotalHint();

      }
    });
    document.getElementById("lineItemsBody").addEventListener("focusin", (event) => {
      if (!event.target.classList.contains("line-unit") && !event.target.classList.contains("line-qty")) return;
      if (event.target.value === "0") {
        event.target.value = "";
      }
    });
    document.getElementById("lineItemsBody").addEventListener("focusout", (event) => {
      if (!event.target.classList.contains("line-unit") && !event.target.classList.contains("line-qty")) return;
      const raw = event.target.value.trim();
      const row = event.target.closest(".line-item-row");
      if (!raw) {
        event.target.value = "";
        if (row) syncLineItemAmount(row);
        syncSchoolLineTotalHint();
        return;
      }
      const n = parseInputNumber(raw);
      if (!Number.isFinite(n) || n < 0) {
        event.target.value = "";
      } else {
        event.target.value = String(n);
      }
      if (row) syncLineItemAmount(row);
      syncSchoolLineTotalHint();
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      await submitInvoice(false);
    });

    document.getElementById("previewBtn").addEventListener("click", async () => {
      if (!form.reportValidity()) return;
      await submitInvoice(true);
    });
    document.getElementById("csvImportUniversityBtn").addEventListener("click", async () => {
      try {
        await importCsvInvoices("university");
      } catch (error) {

        alert("大学・連盟用CSV取込に失敗しました: " + error.message);
      }
    });
    document.getElementById("csvImportCorporateBtn").addEventListener("click", async () => {
      try {
        await importCsvInvoices("corporate");
      } catch (error) {
        console.error(error);
        alert("企業用CSV取込に失敗しました: " + error.message);
      }
    });

    setDefaultDates();
    syncFromBase();
    updateTaxInputModeUi();
    updateRecipientKindUi();
    loadNextInvoiceNo(false);
  </script>
